[project]
name = "sharepoint-policy-mcp"
version = "0.1.0"
description = "A read-only Model Context Protocol server over AML policy documents held in SharePoint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    "numpy>=2",
]

[project.optional-dependencies]
# Reading .docx is only needed to build an index, not to serve one, so the
# server installs without it.
ingest = [
    "python-docx>=1.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "python-docx>=1.1",
]

[project.scripts]
sharepoint-policy-mcp = "sharepoint_policy_mcp.server:main"
sharepoint-policy-ingest = "sharepoint_policy_mcp.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sharepoint_policy_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
